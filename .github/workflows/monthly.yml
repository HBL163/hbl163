name: Monthly China money-flow report
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 15 * *" # 10:00 Beijing time, every 15th
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: money-flow-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data and generate HTML archive
        run: python money-flow/scripts/build_report.py
      - name: Save generated report and data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add money-flow/site/data/latest.json money-flow/site/reports
          git diff --cached --quiet || git commit -m "chore(money-flow): archive monthly HTML report"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: money-flow/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
